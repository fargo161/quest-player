services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: quest
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: quest_player
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quest_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest -d quest_player"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  quest_data:

